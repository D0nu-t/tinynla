experiment:
  name: gpt2_nla_research
  description: 'TinyNLA experiment using GPT-2 hidden activations with semantic reconstruction
    and activation patching.

    '
  seed: 42
model:
  target_name: gpt2
  trust_remote_code: false
activation:
  layer_idx: 1
  layer_indices:
  - 1
  - 3
  - 5
  - 7
  - 9
  - 11
  max_length: 64
  pooling: mean
  normalize: true
  hook_point: residual
dataset:
  num_samples: 20000
  source: roneneldan/TinyStories
  max_text_chars: 256
  output_dir: experiments\layer_sweep_20260514_001733\layer_1\dataset
  shuffle: true
  labeling_strategy: heuristic
training:
  batch_size: 16
  lr: 0.0001
  epochs: 10
  hidden_dim: 2048
  save_dir: experiments\layer_sweep_20260514_001733\layer_1\checkpoints
  save_best_only: true
  grad_clip: 1.0
  weight_decay: 0.01
  early_stopping_patience: 5
evaluation:
  num_eval_samples: 200
  topk: 10
  evaluate_random: true
  evaluate_zero: true
  evaluate_interpolation: true
tracking:
  use_wandb: true
  project: TinyNLA
  run_name: gpt2_layer_1
  log_model_artifacts: true
  log_tables: true
device: cuda
paths:
  logs_dir: logs
  experiment_dir: experiments
  metrics_dir: metrics
