# ==========================================================
# TinyNLA Base Configuration — v3.0
# ==========================================================
# Config loading priority:
#   1. TINYNLA_CONFIG env var  (set by layer_sweep per subprocess)
#   2. configs/base.yaml       (default)
#
# v3.0 changes from v2.0:
#   activation.pooling         : "sequence"       (full [seq_len, 768] per sample)
#   training.reconstructor_type: "token_decoder"  (distilgpt2 + TransformerDecoder)
#   training.encoder_name      : "distilgpt2"     (causal; matches GPT-2 bias)
#   training.decoder_layers    : 4                (TransformerDecoder depth)
#   training.decoder_heads     : 8                (TransformerDecoder attention heads)
#   training.batch_size        : 8                (sequence tensors larger than pooled)
#   training.foreach           : false            (prevents OOM on <=4 GB VRAM)
#   tracking.mode              : "offline"        (prevents WandB IPC crash on Windows)
# ==========================================================

experiment:
  name: "gpt2_nla_sequence"
  description: >
    TinyNLA v3: sequence-level residual stream reconstruction.
    Stores full [seq_len, 768] activation trajectories.
    Reconstructs with TokenLevelReconstructor (distilgpt2 + TransformerDecoder).
    Patches token-by-token with SequenceInterpolationPatcher.
  seed: 42

model:
  target_name: "gpt2"
  trust_remote_code: false

activation:
  layer_idx: 1
  layer_indices: [1, 3, 5, 7, 9, 11]
  max_length: 64
  # "sequence" — store full [seq_len, hidden_dim]   (v3 default)
  # "mean"     — pooled baseline                     (legacy)
  # "last"     — last-token only                     (legacy)
  pooling: "sequence"
  normalize: true

dataset:
  num_samples: 5000
  source: "roneneldan/TinyStories"
  max_text_chars: 256
  output_dir: "activation_data/activation_buffer"
  shuffle: true

training:
  batch_size: 8          # sequence tensors are [seq_len, 768]; 8 fits 4 GB
  lr: 0.0001
  epochs: 1
  hidden_dim: 2048       # kept for legacy pooled_mlp compatibility
  save_dir: "checkpoints/ar"
  grad_clip: 1.0
  weight_decay: 0.01
  early_stopping_patience: 5

  # "token_decoder" — distilgpt2 + TransformerDecoder  (v3 default)
  # "pooled_mlp"    — DistilBERT + MLP                 (legacy)
  reconstructor_type: "token_decoder"
  encoder_name: "distilgpt2"

  # TokenLevelReconstructor TransformerDecoder parameters
  decoder_layers: 4      # number of TransformerDecoder layers
  decoder_heads: 8       # attention heads (embed_dim 768 must be divisible by this)

  # false avoids multi-tensor Adam _foreach_sqrt OOM on small VRAM
  foreach: false

evaluation:
  num_eval_samples: 200
  topk: 10
  baselines:
    random: true
    zero: true
  # h_patch_t = alpha * h_recon_t + (1 - alpha) * h_orig_t  per position
  interpolation:
    enabled: true
    alphas: [0.0, 0.1, 0.25, 0.5, 0.75, 1.0]
    num_pairs: 50
  perplexity_shift: true

tracking:
  use_wandb: true
  project: "TinyNLA"
  run_name: "gpt2_layer5_sequence"
  log_model_artifacts: true
  log_tables: true
  # "offline" prevents WandB Windows IPC socket crash on long sweeps.
  # Sync afterward: wandb sync wandb/run-<id>
  mode: "disabled"

device: "auto"   # resolves cuda > cpu

paths:
  logs_dir: "logs"
  experiment_dir: "experiments"
  metrics_dir: "metrics"