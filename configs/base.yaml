# ==========================================================
# TinyNLA Base Configuration — v2.0
# ==========================================================
# Config loading priority:
#   1. Path in TINYNLA_CONFIG env var (layer sweep overrides)
#   2. Fallback: configs/base.yaml
# ==========================================================

experiment:
  name: "gpt2_nla_research"
  description: >
    TinyNLA: text-conditioned residual stream reconstruction
    on GPT-2 with mean-pooled activations, interpolation patching,
    and multi-layer functional evaluation.
  seed: 42

model:
  target_name: "gpt2"
  trust_remote_code: false

activation:
  layer_idx: 5
  layer_indices: [1, 3, 5, 7, 9, 11]
  max_length: 64
  # "mean" (recommended) | "last" (legacy)
  pooling: "mean"
  normalize: true

dataset:
  num_samples: 20000
  source: "roneneldan/TinyStories"
  max_text_chars: 256
  output_dir: "datasets/activation_buffer"
  shuffle: true

training:
  batch_size: 16
  lr: 0.0001
  epochs: 10
  hidden_dim: 2048
  save_dir: "checkpoints/ar"
  grad_clip: 1.0
  weight_decay: 0.01
  early_stopping_patience: 5
  # "pooled_mlp"    — DistilBERT + MLP (stable baseline)
  # "token_decoder" — BGE + TransformerDecoder (experimental)
  reconstructor_type: "pooled_mlp"
  encoder_name: "distilbert-base-uncased"

evaluation:
  num_eval_samples: 200
  topk: 10
  baselines:
    random: true
    zero: true
  # h_patch = alpha * h_reconstructed + (1 - alpha) * h_original
  # alpha=0.0 is identity; alpha=1.0 is full replacement
  interpolation:
    enabled: true
    alphas: [0.0, 0.1, 0.25, 0.5, 0.75, 1.0]
    num_pairs: 50
  perplexity_shift: true

tracking:
  use_wandb: true
  project: "TinyNLA"
  run_name: "gpt2_layer5_meanpool"
  log_model_artifacts: true
  log_tables: true

# "auto" resolves: cuda > cpu
device: "auto"

paths:
  logs_dir: "logs"
  experiment_dir: "experiments"
  metrics_dir: "metrics"